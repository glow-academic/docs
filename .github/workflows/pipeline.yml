name: Pipeline

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: learnloopllc/glow-docs

jobs:
  # ── Stage 1: Test ───────────────────────────────────────────
  # Lightweight check — full build happens in the Docker image (release stage).
  # A full `next build` with 946 MDX pages needs 8GB+ and takes ~7min;
  # the Docker builder already handles this with NODE_OPTIONS.
  test:
    runs-on: self-hosted
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v5

      - run: npm install --prefer-offline

      - name: Typecheck
        run: npx tsc --noEmit

  # ── Stage 2: Release ────────────────────────────────────────
  release:
    needs: test
    runs-on: self-hosted
    if: github.event_name != 'pull_request'
    outputs:
      released: ${{ steps.check.outputs.released }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          BRANCH="${{ github.ref_name }}"
          if [ "$BRANCH" = "beta" ]; then
            TAG="v${VERSION}-beta"
          else
            TAG="v${VERSION}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Check if release exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" &>/dev/null; then
            echo "Release $TAG already exists — skipping build"
            echo "released=false" >> $GITHUB_OUTPUT
          else
            echo "Release $TAG not found — will build"
            echo "released=true" >> $GITHUB_OUTPUT
          fi

      - name: Create tag (idempotent)
        if: steps.check.outputs.released == 'true'
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "Tag $TAG already exists — skipping"
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Generate compat.json
        if: steps.check.outputs.released == 'true'
        run: |
          python3 -c "
          import json
          with open('api-versions.json') as f:
              versions = json.load(f)
          compat = {
              'component': 'glow-docs',
              'min_glow_api': versions['glow-api']['version'],
              'version': '${{ steps.version.outputs.version }}',
          }
          with open('compat.json', 'w') as f:
              json.dump(compat, f, indent=2)
          "

      - uses: docker/login-action@v4
        if: steps.check.outputs.released == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build latest image (both branches)
      - name: Build & push (latest)
        if: steps.check.outputs.released == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: DOCS_BASE_PATH=/latest
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name == 'main' && 'latest' || 'beta' }}
          labels: |
            org.opencontainers.image.source=https://github.com/learnloopllc/docs
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build versioned image (main only — beta doesn't host previous versions)
      - name: Build & push (versioned)
        if: steps.check.outputs.released == 'true' && github.ref_name == 'main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: DOCS_BASE_PATH=/v${{ steps.version.outputs.version }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/learnloopllc/docs
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create release
        if: steps.check.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          PRERELEASE=""
          if [ "${{ github.ref_name }}" = "beta" ]; then
            PRERELEASE="--prerelease"
          fi
          gh release create "$TAG" compat.json \
            --title "$TAG" \
            --generate-notes \
            $PRERELEASE
          echo "Created release $TAG"

  # Deploy is handled by learnloopllc/api via webhook on release
