# Local development – single app service.
# Deploy workflow generates blue-green compose on the server.
services:
  app-blue:
    image: ${DOCS_REGISTRY:-ghcr.io/learnloopllc}/glow-docs:${DOCS_VERSION:?}
    restart: unless-stopped
    environment:
      - HOSTNAME=0.0.0.0
      - INTERNAL_API_BASE=http://glow-nginx:80
      - NODE_ENV=production
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-}
      - BETTER_AUTH_URL=${ORIGIN:-http://localhost:3300}
      - AUTH_CLIENT_ID=${AUTH_CLIENT_ID:-glow-docs}
      - AUTH_CLIENT_SECRET=${AUTH_CLIENT_SECRET:-}
      - GLOW_API_URL=${GLOW_API_URL:-http://glow-nginx:80}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - internal

  app-green:
    image: ${DOCS_REGISTRY:-ghcr.io/learnloopllc}/glow-docs:${DOCS_VERSION:?}
    restart: unless-stopped
    environment:
      - HOSTNAME=0.0.0.0
      - INTERNAL_API_BASE=http://glow-nginx:80
      - NODE_ENV=production
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-}
      - BETTER_AUTH_URL=${ORIGIN:-http://localhost:3300}
      - AUTH_CLIENT_ID=${AUTH_CLIENT_ID:-glow-docs}
      - AUTH_CLIENT_SECRET=${AUTH_CLIENT_SECRET:-}
      - GLOW_API_URL=${GLOW_API_URL:-http://glow-nginx:80}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - internal

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - app-blue
      - app-green
    environment:
      - ACTIVE_ENV=${ACTIVE_ENV:-blue}
      - MCP_BACKEND=${MCP_BACKEND:-glow-nginx:80}
    volumes:
      - ./web/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./web/generated:/etc/nginx/conf.d/generated:rw
    networks:
      - internal

  docker-gen:
    image: jwilder/docker-gen:0.7.6
    restart: unless-stopped
    environment:
      - COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME}
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./web/templates:/etc/docker-gen/templates:ro
      - ./web/generated:/etc/nginx/conf.d/generated:rw
    command: >
      -notify-sighup ${COMPOSE_PROJECT_NAME}-nginx
      -watch
      /etc/docker-gen/templates/upstreams.tmpl
      /etc/nginx/conf.d/generated/upstreams.conf
    networks:
      - internal

networks:
  internal:
